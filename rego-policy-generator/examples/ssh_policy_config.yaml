# Example configuration for generating an SSH security policy
title: "No SSH Access from Internet"
framework: "CIS AWS Foundations Benchmark"
control_id: "CIS-4.1"
severity: "CRITICAL"
description: "Ensure security groups don't allow SSH access from 0.0.0.0/0"
resource_type: "AWS::EC2::SecurityGroup"
config_path: "ipPermissions"
conditions:
  - "some rule in input.configuration.ipPermissions"
  - "rule.fromPort == 22"
  - "rule.toPort == 22"
  - "some range in rule.ipRanges"
  - 'range.cidrIp == "0.0.0.0/0"'